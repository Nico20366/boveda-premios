<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Admin - Bóveda de Premios</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Plus+Jakarta+Sans:wght@500;700;800&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #050508; color: #f4f4f5; min-height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; }
        .cinzel { font-family: 'Cinzel', serif; }
        :root { --neon-main: #f59e0b; }
        .casino-bg { background-color: #050508; background-image: radial-gradient(circle at 50% 15%, rgba(245, 158, 11, 0.2) 0%, transparent 60%), radial-gradient(circle at 50% 90%, rgba(0,0,0,0.98) 0%, transparent 70%); }
        .slot-marquee { border: 3px solid #d97706; box-shadow: 0 10px 40px -10px rgba(0, 0, 0, 0.95), 0 0 25px rgba(245, 158, 11, 0.2); background: linear-gradient(145deg, #0d0d14 0%, #050508 100%); }
        .dynamic-text { color: var(--neon-main) !important; text-shadow: 0 0 15px rgba(245, 158, 11, 0.4); }
        .dynamic-btn { background: linear-gradient(135deg, #fbbf24 0%, #d97706 100%); color: #000; font-weight: 900; box-shadow: 0 4px 20px rgba(245, 158, 11, 0.4); transition: all 0.2s ease; }
        .dynamic-btn:hover { filter: brightness(1.15); transform: translateY(-2px); }
    </style>
</head>
<body class="casino-bg p-4">

    <div class="max-w-sm w-full slot-marquee rounded-3xl p-6 sm:p-8 backdrop-blur-xl text-center space-y-5">
        <div class="text-5xl mb-1">🔐</div>
        <div>
            <h1 class="cinzel text-xl sm:text-2xl font-black dynamic-text">PANEL ADMIN</h1>
            <p class="text-[11px] text-zinc-400 font-bold uppercase tracking-wider mt-1">Acceso restringido</p>
        </div>

        <div class="space-y-3 text-left">
            <div>
                <label class="text-[10px] text-zinc-400 font-bold uppercase tracking-wider block mb-1">Usuario:</label>
                <input type="text" id="login-user" autocapitalize="none" autocorrect="off" placeholder="Tu usuario" class="w-full bg-black/90 border-2 border-zinc-700 focus:border-amber-500 rounded-xl px-3.5 py-3 text-xs text-white font-bold focus:outline-none shadow-inner">
            </div>
            <div>
                <label class="text-[10px] text-zinc-400 font-bold uppercase tracking-wider block mb-1">Contraseña:</label>
                <input type="password" id="login-pass" placeholder="••••••••" class="w-full bg-black/90 border-2 border-zinc-700 focus:border-amber-500 rounded-xl px-3.5 py-3 text-xs text-white font-bold focus:outline-none shadow-inner">
            </div>
        </div>

        <button onclick="loginAdmin()" class="w-full dynamic-btn py-3 rounded-xl cinzel tracking-wider uppercase text-xs font-black">
            INGRESAR 🚀
        </button>

        <p id="login-error" class="text-amber-400 text-xs font-bold hidden"></p>
        
        <div class="pt-2 border-t border-zinc-800">
            <a href="index.html" class="text-[11px] text-zinc-500 hover:text-amber-400 font-bold transition-colors">← Volver al inicio</a>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBqLgy8LhtKaOZgf1tLH5tG6Pm8qYj3ouQ",
            authDomain: "boveda-premios-1ebe0.firebaseapp.com",
            databaseURL: "https://boveda-premios-1ebe0-default-rtdb.firebaseio.com",
            projectId: "boveda-premios-1ebe0",
            storageBucket: "boveda-premios-1ebe0.firebasestorage.app",
            messagingSenderId: "362480473345",
            appId: "1:362480473345:web:5cc957ea431f0c713c3700",
            measurementId: "G-DTRB9M5KJ4"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        function loginAdmin() {
            // Convertimos siempre a minúsculas para evitar errores con el teclado del celular
            let user = document.getElementById('login-user').value.trim().toLowerCase();
            let pass = document.getElementById('login-pass').value.trim();
            let err = document.getElementById('login-error');

            if(!user || !pass) {
                err.innerText = "Completa todos los campos.";
                err.classList.remove('hidden');
                return;
            }

            db.ref('admins/' + user).once('value', (snap) => {
                let data = snap.val();
                if(!data || String(data.password) !== pass) {
                    err.innerText = "❌ Usuario o contraseña incorrectos.";
                    err.classList.remove('hidden');
                    return;
                }

                if(user !== "superadmin" && data.approved !== true) {
                    err.innerText = "⏳ Tu cuenta espera aprobación del Super Admin.";
                    err.classList.remove('hidden');
                    return;
                }

                localStorage.setItem("current_admin", user);
                localStorage.setItem("admin_role", user === "superadmin" ? "super" : "admin");
                window.location.href = "admin.html";
            });
        }
    </script>
</body>
</html>
