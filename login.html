<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso Admin - Bóveda</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Plus+Jakarta+Sans:wght@500;700;800&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #07070a; color: #f4f4f5; }
        .cinzel { font-family: 'Cinzel', serif; }
        :root { --neon-main: #f59e0b; }
        .casino-bg { background-color: #050508; background-image: radial-gradient(circle at 50% 10%, rgba(245, 158, 11, 0.15) 0%, transparent 50%), radial-gradient(circle at 50% 90%, rgba(0,0,0,0.95) 0%, transparent 60%); }
        .slot-marquee { border: 1px solid rgba(245, 158, 11, 0.3); box-shadow: 0 10px 40px -10px rgba(0, 0, 0, 0.9), 0 0 20px rgba(245, 158, 11, 0.08); background: linear-gradient(145deg, #0d0d12 0%, #060609 100%); }
        .dynamic-text { color: var(--neon-main) !important; }
        .dynamic-btn { background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%); color: #000; font-weight: 800; box-shadow: 0 4px 20px rgba(245, 158, 11, 0.3); transition: all 0.2s ease; }
        .dynamic-btn:hover { filter: brightness(1.1); transform: translateY(-1px); }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between casino-bg p-4">

    <header class="w-full py-4 px-6 border-b border-zinc-800/60 flex justify-between items-center bg-[#07070a]/90 backdrop-blur-md rounded-2xl">
        <div class="flex items-center space-x-2">
            <span class="text-2xl">🔐</span>
            <div>
                <h1 class="cinzel text-sm sm:text-base font-black dynamic-text tracking-wider">ACCESO ADMIN</h1>
                <p class="text-[9px] uppercase tracking-widest text-zinc-400 font-bold">ZONA RESTRINGIDA</p>
            </div>
        </div>
        <a href="index.html" class="text-xs bg-zinc-900 hover:bg-zinc-800 text-zinc-300 border border-zinc-700 px-3 py-1.5 rounded-lg font-bold">
            ← VOLVER
        </a>
    </header>

    <main class="flex-grow flex items-center justify-center px-4 py-8">
        <div class="max-w-md w-full slot-marquee rounded-3xl p-6 sm:p-8">
            <h2 id="form-title" class="cinzel text-xl font-black dynamic-text text-center mb-5">LOGIN DE ACCESO</h2>
            <div id="msg-box" class="mb-4 text-xs font-bold text-center text-red-400 hidden bg-red-950/40 p-2.5 rounded-xl border border-red-800/60"></div>

            <!-- Login Form -->
            <div id="login-form" class="space-y-4">
                <div>
                    <label class="text-[11px] text-zinc-300 font-bold uppercase tracking-wider">Usuario / Alias:</label>
                    <input type="text" id="log-user" placeholder="Escribe tu usuario" class="w-full bg-black/80 border border-zinc-700 rounded-xl px-4 py-3 text-xs text-white font-bold mt-1 focus:border-amber-500 focus:outline-none">
                </div>
                <div>
                    <label class="text-[11px] text-zinc-300 font-bold uppercase tracking-wider">Contraseña:</label>
                    <input type="password" id="log-pass" placeholder="••••••••" class="w-full bg-black/80 border border-zinc-700 rounded-xl px-4 py-3 text-xs text-white font-bold mt-1 focus:border-amber-500 focus:outline-none">
                </div>
                <button onclick="loginAdmin()" class="w-full dynamic-btn py-3.5 rounded-xl text-xs cinzel uppercase tracking-widest mt-2">
                    INICIAR SESIÓN 🚀
                </button>
                <div class="text-center pt-4 border-t border-zinc-800/80 mt-4">
                    <p class="text-xs text-zinc-400">¿No tienes cuenta de administrador?</p>
                    <button onclick="toggleView('register')" class="text-amber-400 text-xs font-bold underline uppercase tracking-wider mt-1 hover:text-white">
                        Registrarse / Solicitar Permiso 📝
                    </button>
                </div>
            </div>

            <!-- Register Form -->
            <div id="register-form" class="space-y-4 hidden">
                <div>
                    <label class="text-[11px] text-zinc-300 font-bold uppercase tracking-wider">Correo Electrónico:</label>
                    <input type="email" id="reg-email" placeholder="tucorreo@email.com" class="w-full bg-black/80 border border-zinc-700 rounded-xl px-4 py-3 text-xs text-white font-bold mt-1 focus:border-amber-500 focus:outline-none">
                </div>
                <div>
                    <label class="text-[11px] text-zinc-300 font-bold uppercase tracking-wider">Crea tu Usuario / Alias:</label>
                    <input type="text" id="reg-name" placeholder="Ej: Carlos" class="w-full bg-black/80 border border-zinc-700 rounded-xl px-4 py-3 text-xs text-white font-bold mt-1 focus:border-amber-500 focus:outline-none">
                </div>
                <div>
                    <label class="text-[11px] text-zinc-300 font-bold uppercase tracking-wider">Crea tu Contraseña:</label>
                    <input type="password" id="reg-pass" placeholder="••••••••" class="w-full bg-black/80 border border-zinc-700 rounded-xl px-4 py-3 text-xs text-white font-bold mt-1 focus:border-amber-500 focus:outline-none">
                </div>
                <button onclick="registerAdmin()" class="w-full dynamic-btn py-3.5 rounded-xl text-xs cinzel uppercase tracking-widest mt-2">
                    ENVIAR SOLICITUD 📨
                </button>
                <div class="text-center pt-4 border-t border-zinc-800/80 mt-4">
                    <p class="text-xs text-zinc-400">¿Ya tienes una cuenta?</p>
                    <button onclick="toggleView('login')" class="text-amber-400 text-xs font-bold underline uppercase tracking-wider mt-1 hover:text-white">
                        ← Volver a Iniciar Sesión
                    </button>
                </div>
            </div>
        </div>
    </main>

    <footer class="w-full py-3 text-center text-[10px] text-zinc-500 border-t border-zinc-800/50 bg-[#07070a] rounded-2xl">
        BÓVEDA DE LA SUERTE © 2026
    </footer>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBqLgy8LhtKaOZgf1tLH5tG6Pm8qYj3ouQ",
            authDomain: "boveda-premios-1ebe0.firebaseapp.com",
            databaseURL: "https://boveda-premios-1ebe0-default-rtdb.firebaseio.com",
            projectId: "boveda-premios-1ebe0",
            storageBucket: "boveda-premios-1ebe0.firebasestorage.app",
            messagingSenderId: "362480473345",
            appId: "1:362480473345:web:5cc957ea431f0c713c3700",
            measurementId: "G-DTRB9M5KJ4"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        function toggleView(view) {
            let loginForm = document.getElementById('login-form');
            let registerForm = document.getElementById('register-form');
            let title = document.getElementById('form-title');
            document.getElementById('msg-box').classList.add('hidden');
            if(view === 'register') {
                loginForm.classList.add('hidden'); registerForm.classList.remove('hidden'); title.innerText = "REGISTRO DE ADMIN";
            } else {
                registerForm.classList.add('hidden'); loginForm.classList.remove('hidden'); title.innerText = "LOGIN DE ACCESO";
            }
        }

        function registerAdmin() {
            let email = document.getElementById('reg-email').value.trim();
            let name = document.getElementById('reg-name').value.trim();
            let pass = document.getElementById('reg-pass').value.trim();
            let msg = document.getElementById('msg-box');

            if(!email || !name || !pass) { msg.innerText = "Complete todos los campos."; msg.classList.remove('hidden'); return; }

            db.ref('admins/' + name).once('value', (snap) => {
                if(snap.exists()) { msg.innerText = "⚠️ Ese usuario ya existe."; msg.classList.remove('hidden'); return; }
                
                db.ref('admins/' + name).set({
                    email: email,
                    password: pass,
                    approved: false
                }, () => {
                    alert("¡Solicitud enviada con éxito! Queda pendiente de aprobación.");
                    toggleView('login');
                });
            });
        }

        function loginAdmin() {
            let name = document.getElementById('log-user').value.trim();
            let pass = document.getElementById('log-pass').value.trim();
            let msg = document.getElementById('msg-box');

            if(name === "superadmin" && pass === "123456") {
                localStorage.setItem("current_admin", "SuperAdmin");
                localStorage.setItem("admin_role", "super");
                window.location.href = "admin.html";
                return;
            }

            db.ref('admins/' + name).once('value', (snap) => {
                let data = snap.val();
                if(!data || data.password !== pass) { msg.innerText = "❌ Usuario o contraseña incorrectos."; msg.classList.remove('hidden'); return; }
                if(!data.approved) { msg.innerText = "⏳ Tu cuenta aún no ha sido aprobada."; msg.classList.remove('hidden'); return; }

                localStorage.setItem("current_admin", name);
                localStorage.setItem("admin_role", "admin");
                window.location.href = "admin.html";
            });
        }
    </script>
</body>
</html>
