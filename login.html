<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso Administradores - Bóveda</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Plus+Jakarta+Sans:wght@600;800;900&display=swap" rel="stylesheet">
    <!-- Firebase SDKs (Auth + Realtime Database) -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #020204; color: #ffffff; }
        .cinzel { font-family: 'Cinzel', serif; }
        :root { --neon-main: #eab308; --neon-glow: rgba(234, 179, 8, 0.3); --neon-shadow: rgba(234, 179, 8, 0.7); }
        .casino-bg { background-color: #050508; background-image: radial-gradient(circle at 50% 20%, var(--neon-glow) 0%, transparent 60%), radial-gradient(circle at 50% 90%, rgba(0,0,0,0.95) 0%, transparent 60%); }
        .slot-marquee { border: 4px solid var(--neon-main); box-shadow: 0 0 35px var(--neon-shadow), inset 0 0 20px rgba(0,0,0,0.8); background: linear-gradient(180deg, #141419 0%, #08080b 100%); }
        .dynamic-text { text-shadow: 0 0 15px var(--neon-main); color: var(--neon-main) !important; }
        .dynamic-btn { background: linear-gradient(135deg, var(--neon-main) 0%, #ca8a04 100%); color: #000 !important; font-weight: 900; box-shadow: 0 0 25px var(--neon-shadow); }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between casino-bg p-4">

    <header class="w-full py-4 px-5 border-b border-zinc-800 flex justify-between items-center bg-black/95 rounded-2xl shadow-2xl">
        <div class="flex items-center space-x-2">
            <span class="text-3xl">🔐</span>
            <div>
                <h1 class="cinzel text-base sm:text-xl font-black dynamic-text tracking-wider">ACCESO ADMIN</h1>
                <p class="text-[9px] uppercase tracking-widest text-zinc-400 font-bold">ZONA RESTRINGIDA</p>
            </div>
        </div>
        <a href="index.html" class="text-xs bg-zinc-900 hover:bg-zinc-800 text-zinc-300 border border-zinc-700 px-3 py-1.5 rounded-lg font-bold cinzel shadow-lg">
            ← VOLVER
        </a>
    </header>

    <main class="flex-grow flex items-center justify-center px-4 py-8">
        <div class="max-w-md w-full slot-marquee rounded-3xl p-8 shadow-2xl">
            <h2 id="form-title" class="cinzel text-2xl font-black dynamic-text text-center mb-6">LOGIN DE ACCESO</h2>
            <div id="msg-box" class="mb-4 text-xs font-bold text-center text-red-400 hidden bg-red-950/40 p-2 rounded-xl border border-red-800"></div>

            <!-- Login Form -->
            <div id="login-form" class="space-y-4">
                <div>
                    <label class="text-xs text-zinc-300 font-bold uppercase tracking-wider">Correo o Usuario:</label>
                    <input type="text" id="log-user" placeholder="tucorreo@email.com o usuario" class="w-full bg-black border-2 border-zinc-700 rounded-xl px-4 py-3 text-sm text-white font-bold mt-1 focus:border-amber-500 focus:outline-none">
                </div>
                <div>
                    <label class="text-xs text-zinc-300 font-bold uppercase tracking-wider">Contraseña:</label>
                    <div class="relative mt-1">
                        <input type="password" id="log-pass" placeholder="••••••••" class="w-full bg-black border-2 border-zinc-700 rounded-xl px-4 py-3 text-sm text-white font-bold focus:border-amber-500 focus:outline-none">
                        <button type="button" onclick="togglePassword('log-pass')" class="absolute right-3 top-3.5 text-xs text-zinc-400 font-bold">👁️</button>
                    </div>
                </div>
                <button onclick="loginAdmin()" class="w-full dynamic-btn py-4 rounded-xl text-sm cinzel uppercase tracking-widest mt-2">
                    INICIAR SESIÓN 🚀
                </button>
                <div class="flex justify-between items-center pt-2 text-xs">
                    <button onclick="forgotPassword()" class="text-zinc-400 hover:text-amber-400 underline">¿Olvidaste tu contraseña?</button>
                </div>
                <div class="text-center pt-4 border-t border-zinc-800 mt-4">
                    <p class="text-xs text-zinc-400">¿No tienes cuenta de administrador?</p>
                    <button onclick="toggleView('register')" class="text-amber-400 text-xs font-black underline uppercase tracking-wider mt-1 hover:text-white">
                        Registrarse / Solicitar Permiso 📝
                    </button>
                </div>
            </div>

            <!-- Register Form -->
            <div id="register-form" class="space-y-4 hidden">
                <div>
                    <label class="text-xs text-zinc-300 font-bold uppercase tracking-wider">Correo Electrónico:</label>
                    <input type="email" id="reg-email" placeholder="tucorreo@email.com" class="w-full bg-black border-2 border-zinc-700 rounded-xl px-4 py-3 text-sm text-white font-bold mt-1 focus:border-amber-500 focus:outline-none">
                </div>
                <div>
                    <label class="text-xs text-zinc-300 font-bold uppercase tracking-wider">Crea tu Usuario / Alias:</label>
                    <input type="text" id="reg-name" placeholder="Ej: Carlos" class="w-full bg-black border-2 border-zinc-700 rounded-xl px-4 py-3 text-sm text-white font-bold mt-1 focus:border-amber-500 focus:outline-none">
                </div>
                <div>
                    <label class="text-xs text-zinc-300 font-bold uppercase tracking-wider">Crea tu Contraseña (mín. 6 car.):</label>
                    <div class="relative mt-1">
                        <input type="password" id="reg-pass" placeholder="••••••••" class="w-full bg-black border-2 border-zinc-700 rounded-xl px-4 py-3 text-sm text-white font-bold focus:border-amber-500 focus:outline-none">
                        <button type="button" onclick="togglePassword('reg-pass')" class="absolute right-3 top-3.5 text-xs text-zinc-400 font-bold">👁️</button>
                    </div>
                </div>
                <button onclick="registerAdmin()" class="w-full dynamic-btn py-4 rounded-xl text-sm cinzel uppercase tracking-widest mt-2">
                    ENVIAR SOLICITUD 📨
                </button>
                <div class="text-center pt-4 border-t border-zinc-800 mt-6">
                    <p class="text-xs text-zinc-400">¿Ya tienes una cuenta?</p>
                    <button onclick="toggleView('login')" class="text-amber-400 text-xs font-black underline uppercase tracking-wider mt-1 hover:text-white">
                        ← Volver a Iniciar Sesión
                    </button>
                </div>
            </div>
        </div>
    </main>

    <footer class="w-full py-4 text-center text-xs text-zinc-400 border-t border-zinc-800 bg-black/95 rounded-2xl">
        BÓVEDA DE LA SUERTE © 2026
    </footer>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBqLgy8LhtKaOZgf1tLH5tG6Pm8qYj3ouQ",
            authDomain: "boveda-premios-1ebe0.firebaseapp.com",
            databaseURL: "https://boveda-premios-1ebe0-default-rtdb.firebaseio.com",
            projectId: "boveda-premios-1ebe0",
            storageBucket: "boveda-premios-1ebe0.firebasestorage.app",
            messagingSenderId: "362480473345",
            appId: "1:362480473345:web:5cc957ea431f0c713c3700",
            measurementId: "G-DTRB9M5KJ4"
        };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.database();

        function toggleView(view) {
            let loginForm = document.getElementById('login-form');
            let registerForm = document.getElementById('register-form');
            let title = document.getElementById('form-title');
            document.getElementById('msg-box').classList.add('hidden');
            if(view === 'register') {
                loginForm.classList.add('hidden'); registerForm.classList.remove('hidden'); title.innerText = "REGISTRO DE ADMIN";
            } else {
                registerForm.classList.add('hidden'); loginForm.classList.remove('hidden'); title.innerText = "LOGIN DE ACCESO";
            }
        }

        function togglePassword(id) {
            let input = document.getElementById(id);
            input.type = input.type === 'password' ? 'text' : 'password';
        }

        function registerAdmin() {
            let email = document.getElementById('reg-email').value.trim();
            let name = document.getElementById('reg-name').value.trim();
            let pass = document.getElementById('reg-pass').value.trim();
            let msg = document.getElementById('msg-box');

            if(!email || !name || !pass) { msg.innerText = "Complete todos los campos."; msg.classList.remove('hidden'); return; }
            if(pass.length < 6) { msg.innerText = "La contraseña debe tener al menos 6 caracteres."; msg.classList.remove('hidden'); return; }

            // Crear usuario en Firebase Auth con correo y contraseña
            auth.createUserWithEmailAndPassword(email, pass)
                .then((userCredential) => {
                    let uid = userCredential.user.uid;
                    // Guardar datos adicionales en la base de datos en tiempo real
                    db.ref('admins/' + name).set({
                        email: email,
                        uid: uid,
                        password: pass,
                        approved: false
                    }, () => {
                        alert("¡Solicitud enviada con éxito! Queda pendiente de aprobación por el Super Admin.");
                        toggleView('login');
                    });
                })
                .catch((error) => {
                    msg.innerText = "❌ Error al registrar: " + error.message;
                    msg.classList.remove('hidden');
                });
        }

        function loginAdmin() {
            let identifier = document.getElementById('log-user').value.trim();
            let pass = document.getElementById('log-pass').value.trim();
            let msg = document.getElementById('msg-box');

            if(identifier === "superadmin" && pass === "123456") {
                localStorage.setItem("current_admin", "SuperAdmin");
                localStorage.setItem("admin_role", "super");
                window.location.href = "admin.html";
                return;
            }

            // Verificar si ingresó un correo o un usuario
            let queryRef = identifier.includes('@') 
                ? db.ref('admins').orderByChild('email').equalTo(identifier)
                : db.ref('admins/' + identifier);

            if (identifier.includes('@')) {
                queryRef.once('value', (snap) => {
                    let data = snap.val();
                    if(!data) { msg.innerText = "❌ Correo no encontrado."; msg.classList.remove('hidden'); return; }
                    let username = Object.keys(data)[0];
                    let adminData = data[username];

                    if(adminData.password !== pass) { msg.innerText = "❌ Contraseña incorrecta."; msg.classList.remove('hidden'); return; }
                    if(!adminData.approved) { msg.innerText = "⏳ Tu cuenta aún no ha sido aprobada."; msg.classList.remove('hidden'); return; }

                    localStorage.setItem("current_admin", username);
                    localStorage.setItem("admin_role", "admin");
                    window.location.href = "admin.html";
                });
            } else {
                db.ref('admins/' + identifier).once('value', (snap) => {
                    let data = snap.val();
                    if(!data || data.password !== pass) { msg.innerText = "❌ Usuario o contraseña incorrectos."; msg.classList.remove('hidden'); return; }
                    if(!data.approved) { msg.innerText = "⏳ Tu cuenta aún no ha sido aprobada."; msg.classList.remove('hidden'); return; }

                    localStorage.setItem("current_admin", identifier);
                    localStorage.setItem("admin_role", "admin");
                    window.location.href = "admin.html";
                });
            }
        }

        function forgotPassword() {
            let email = prompt("📧 Ingrese su correo electrónico registrado para recuperar la contraseña:");
            if(!email) return;
            auth.sendPasswordResetEmail(email.trim())
                .then(() => {
                    alert("¡Correo de recuperación enviado! Revisa tu bandeja de entrada o spam.");
                })
                .catch((error) => {
                    alert("❌ Error: " + error.message);
                });
        }
    </script>
</body>
</html>
