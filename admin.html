<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel - Bóveda</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Plus+Jakarta+Sans:wght@600;800&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #020204; color: #ffffff; }
        .cinzel { font-family: 'Cinzel', serif; }
        :root { --neon-main: #eab308; --neon-glow: rgba(234, 179, 8, 0.2); }
        .casino-bg { background-color: #050508; background-image: radial-gradient(circle at 50% 20%, var(--neon-glow) 0%, transparent 70%); }
        .box-card { border: 2px solid var(--neon-main); background: #0c0c10; box-shadow: 0 0 15px rgba(234, 179, 8, 0.15); }
        .dynamic-text { color: var(--neon-main) !important; text-shadow: 0 0 10px var(--neon-main); }
        .btn-gold { background: linear-gradient(135deg, #eab308 0%, #ca8a04 100%); color: #000; font-weight: 800; }
    </style>
</head>
<body class="min-h-screen casino-bg p-3 sm:p-6">
    <div class="max-w-2xl mx-auto space-y-4">
        
        <!-- Header Minimalista -->
        <header class="box-card rounded-2xl p-4 flex justify-between items-center">
            <div>
                <h1 id="panel-title" class="cinzel text-base sm:text-lg font-black dynamic-text">PANEL</h1>
                <p id="welcome-msg" class="text-[11px] text-zinc-400 font-bold"></p>
            </div>
            <button onclick="logout()" class="bg-red-950 text-red-300 border border-red-700 px-3 py-1.5 rounded-xl text-xs font-bold">Salir ✖</button>
        </header>

        <!-- Estadísticas Reducidas -->
        <div class="grid grid-cols-3 gap-2">
            <div class="box-card rounded-xl p-3 text-center">
                <p id="stat-total-label" class="text-[9px] text-zinc-400 font-bold uppercase">Total</p>
                <p id="stat-total" class="text-lg font-black dynamic-text">0</p>
            </div>
            <div class="box-card rounded-xl p-3 text-center">
                <p class="text-[9px] text-emerald-400 font-bold uppercase">Disponibles</p>
                <p id="stat-available" class="text-lg font-black text-emerald-400">0</p>
            </div>
            <div class="box-card rounded-xl p-3 text-center">
                <p class="text-[9px] text-red-400 font-bold uppercase">Usados</p>
                <p id="stat-used" class="text-lg font-black text-red-400">0</p>
            </div>
        </div>

        <!-- Seguridad: Cambiar Contraseña (Compacto) -->
        <div class="box-card rounded-2xl p-4 space-y-3">
            <h3 class="cinzel text-xs font-black text-amber-400">🔑 CAMBIAR MI CONTRASEÑA</h3>
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-2">
                <input type="password" id="current-pass" placeholder="Actual" class="bg-black border border-zinc-700 rounded-xl px-3 py-2 text-xs text-white font-bold focus:border-amber-500 focus:outline-none">
                <input type="password" id="new-pass" placeholder="Nueva" class="bg-black border border-zinc-700 rounded-xl px-3 py-2 text-xs text-white font-bold focus:border-amber-500 focus:outline-none">
            </div>
            <button onclick="changeMyPassword()" class="w-full bg-zinc-800 text-amber-400 border border-amber-500/40 py-2 rounded-xl text-xs font-black uppercase">Actualizar Clave</button>
        </div>

        <!-- Super Admin: Textos (Compacto) -->
        <div id="super-text-section" class="box-card rounded-2xl p-4 hidden space-y-3">
            <h3 class="cinzel text-xs font-black dynamic-text">✏️ TÍTULOS DE LA WEB</h3>
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-2">
                <input type="text" id="edit-title" placeholder="Título Principal" class="bg-black border border-zinc-700 rounded-xl px-3 py-2 text-xs text-white font-bold uppercase focus:outline-none">
                <input type="text" id="edit-subtitle" placeholder="Subtítulo" class="bg-black border border-zinc-700 rounded-xl px-3 py-2 text-xs text-white font-bold uppercase focus:outline-none">
            </div>
            <button onclick="saveSiteTexts()" class="w-full btn-gold py-2 rounded-xl text-xs uppercase">Guardar Títulos</button>
        </div>

        <!-- Super Admin: Control de Admins -->
        <div id="super-admin-section" class="box-card rounded-2xl p-4 hidden space-y-3">
            <div class="flex justify-between items-center">
                <h3 class="cinzel text-xs font-black dynamic-text">👑 ADMINISTRADORES</h3>
                <span id="admins-count-badge" class="text-[9px] bg-amber-500/20 text-amber-300 px-2 py-0.5 rounded font-bold">0</span>
            </div>
            <div id="admins-management-list" class="space-y-2 text-xs font-bold max-h-40 overflow-y-auto"></div>
        </div>

        <!-- Crear Cupón (Compacto) -->
        <div class="box-card rounded-2xl p-4 space-y-3">
            <h3 class="cinzel text-xs font-black dynamic-text">🎁 NUEVO CUPÓN</h3>
            <div class="grid grid-cols-1 sm:grid-cols-3 gap-2">
                <input type="text" id="new-code" placeholder="Código (Ej: VIP1)" class="bg-black border border-zinc-700 rounded-xl px-3 py-2 text-xs text-white font-bold uppercase focus:outline-none">
                <input type="text" id="new-prize" placeholder="Premio (Ej: 20% OFF)" class="bg-black border border-zinc-700 rounded-xl px-3 py-2 text-xs text-white font-bold focus:outline-none">
                <select id="new-expires" class="bg-black border border-zinc-700 rounded-xl px-3 py-2 text-xs text-white font-bold focus:outline-none">
                    <option value="24">24 Horas</option>
                    <option value="48">48 Horas</option>
                    <option value="168">7 Días</option>
                    <option value="99999">Sin Límite</option>
                </select>
            </div>
            <button onclick="createCoupon()" class="w-full btn-gold py-2.5 rounded-xl text-xs uppercase tracking-wider">Crear Cupón 💾</button>
        </div>

        <!-- Lista de Cupones -->
        <div class="box-card rounded-2xl p-4 space-y-3">
            <div class="flex justify-between items-center gap-2">
                <h3 id="list-title" class="cinzel text-xs font-black dynamic-text">📋 CUPONES</h3>
                <input type="text" id="search-code" placeholder="🔍 Buscar..." oninput="filterCoupons()" class="bg-black border border-zinc-700 rounded-xl px-2.5 py-1 text-xs text-white font-bold focus:outline-none w-36">
            </div>
            <div id="coupons-list" class="space-y-1.5 text-xs font-bold max-h-48 overflow-y-auto"></div>
        </div>

    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBqLgy8LhtKaOZgf1tLH5tG6Pm8qYj3ouQ",
            authDomain: "boveda-premios-1ebe0.firebaseapp.com",
            databaseURL: "https://boveda-premios-1ebe0-default-rtdb.firebaseio.com",
            projectId: "boveda-premios-1ebe0",
            storageBucket: "boveda-premios-1ebe0.firebasestorage.app",
            messagingSenderId: "362480473345",
            appId: "1:362480473345:web:5cc957ea431f0c713c3700",
            measurementId: "G-DTRB9M5KJ4"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let currentUser = localStorage.getItem("current_admin");
        let currentRole = localStorage.getItem("admin_role");
        let allCouponsData = {};

        if(!currentUser) { window.location.href = "login.html"; }

        let inactivityTimer;
        function resetInactivityTimer() {
            clearTimeout(inactivityTimer);
            inactivityTimer = setTimeout(() => { logout(); }, 15 * 60 * 1000);
        }
        window.onload = resetInactivityTimer;
        window.onmousemove = resetInactivityTimer;

        if(currentRole === 'super') {
            document.getElementById('welcome-msg').innerText = `${currentUser} (Super Admin)`;
            document.getElementById('panel-title').innerText = "PANEL MAESTRO";
            document.getElementById('stat-total-label').innerText = "Total";
            document.getElementById('list-title').innerText = "📋 TODOS";
            document.getElementById('super-admin-section').classList.remove('hidden');
            document.getElementById('super-text-section').classList.remove('hidden');
            loadAdminsManagement();
            loadCurrentTexts();
        } else {
            document.getElementById('welcome-msg').innerText = `${currentUser} (Admin)`;
            document.getElementById('panel-title').innerText = "PANEL";
            document.getElementById('stat-total-label').innerText = "Mis Total";
            document.getElementById('list-title').innerText = "📋 MIS CUPONES";
        }

        loadCoupons();

        function changeMyPassword() {
            let currentPassInput = document.getElementById('current-pass').value.trim();
            let newPassInput = document.getElementById('new-pass').value.trim();
            if (!currentPassInput || !newPassInput) { alert("Completa ambos campos."); return; }

            if (currentRole === 'super') {
                db.ref('admins/superadmin/password').once('value', (snap) => {
                    if (currentPassInput !== (snap.val() || "123456")) { alert("Contraseña incorrecta."); return; }
                    db.ref('admins/superadmin').update({ password: newPassInput, approved: true }, () => {
                        alert("¡Contraseña actualizada!");
                        document.getElementById('current-pass').value = ""; document.getElementById('new-pass').value = "";
                    });
                });
            } else {
                db.ref('admins/' + currentUser).once('value', (snap) => {
                    let data = snap.val();
                    if (!data || data.password !== currentPassInput) { alert("Contraseña incorrecta."); return; }
                    db.ref('admins/' + currentUser).update({ password: newPassInput }, () => {
                        alert("¡Contraseña actualizada!");
                        document.getElementById('current-pass').value = ""; document.getElementById('new-pass').value = "";
                    });
                });
            }
        }

        function resetAdminPassword(adminName) {
            let newPass = prompt(`Nueva clave para [${adminName}]:`);
            if (!newPass) return;
            db.ref('admins/' + adminName).update({ password: newPass.trim() }, () => { alert("¡Clave actualizada!"); });
        }

        function loadCurrentTexts() {
            db.ref('configuracion').once('value', (snap) => {
                let data = snap.val();
                if(data) {
                    if(data.titulo) document.getElementById('edit-title').value = data.titulo;
                    if(data.subtitulo) document.getElementById('edit-subtitle').value = data.subtitulo;
                }
            });
        }

        function saveSiteTexts() {
            let titulo = document.getElementById('edit-title').value.trim().toUpperCase();
            let subtitulo = document.getElementById('edit-subtitle').value.trim().toUpperCase();
            db.ref('configuracion').set({ titulo: titulo || "BÓVEDA", subtitulo: subtitulo || "PREMIOS" }, () => { alert("¡Guardado!"); });
        }

        function loadAdminsManagement() {
            db.ref('admins').on('value', (snap) => {
                let list = document.getElementById('admins-management-list');
                list.innerHTML = "";
                let data = snap.val();
                if(!data) { document.getElementById('admins-count-badge').innerText = "0"; return; }
                let count = 0;
                for(let name in data) {
                    if(name === "superadmin") continue;
                    count++;
                    let info = data[name];
                    let st = info.approved ? `<span class="text-emerald-400">ACTIVO</span>` : `<span class="text-amber-400">PENDIENTE</span>`;
                    let btn = info.approved 
                        ? `<button onclick="toggleAdminApproval('${name}', false)" class="bg-amber-950 text-amber-300 px-2 py-1 rounded">Suspender</button>`
                        : `<button onclick="toggleAdminApproval('${name}', true)" class="bg-emerald-500 text-black px-2 py-1 rounded font-bold">Aprobar</button>`;
                    
                    list.innerHTML += `
                        <div class="flex justify-between items-center bg-black/60 p-2.5 rounded-xl border border-zinc-800">
                            <div>👤 <strong>${name}</strong> <span class="text-[10px]">${st}</span></div>
                            <div class="flex gap-1">
                                <button onclick="resetAdminPassword('${name}')" class="bg-zinc-800 text-amber-300 px-2 py-1 rounded">🔑</button>
                                ${btn}
                                <button onclick="deleteAdmin('${name}')" class="bg-red-950 text-red-300 px-2 py-1 rounded">🗑️</button>
                            </div>
                        </div>`;
                }
                document.getElementById('admins-count-badge').innerText = count;
            });
        }

        function toggleAdminApproval(name, status) {
            db.ref('admins/' + name).update({ approved: status });
        }

        function deleteAdmin(name) {
            if(!confirm(`¿Eliminar a ${name}?`)) return;
            db.ref('admins/' + name).remove();
        }

        function createCoupon() {
            let code = document.getElementById('new-code').value.trim().toUpperCase();
            let prize = document.getElementById('new-prize').value.trim();
            let hours = parseInt(document.getElementById('new-expires').value);
            if(!code || !prize) { alert("Completa los campos."); return; }

            let expiresAt = new Date().getTime() + (hours * 60 * 60 * 1000);
            db.ref('cupones/' + code).set({
                used: false, createdBy: currentUser, customPrize: prize, createdAt: new Date().toLocaleDateString(), expiresAt: expiresAt
            }, () => {
                alert(`¡Cupón [${code}] creado!`);
                document.getElementById('new-code').value = ""; document.getElementById('new-prize').value = "";
            });
        }

        function loadCoupons() {
            db.ref('cupones').on('value', (snap) => {
                let raw = snap.val() || {};
                if (currentRole === 'admin') {
                    allCouponsData = {};
                    for (let c in raw) { if (raw[c].createdBy === currentUser) allCouponsData[c] = raw[c]; }
                } else { allCouponsData = raw; }
                renderCoupons(allCouponsData);
                updateStats(allCouponsData);
            });
        }

        function updateStats(data) {
            let total = 0, used = 0, avail = 0, now = new Date().getTime();
            for(let c in data) {
                total++;
                if(data[c].used || (data[c].expiresAt && now > data[c].expiresAt)) used++; else avail++;
            }
            document.getElementById('stat-total').innerText = total;
            document.getElementById('stat-available').innerText = avail;
            document.getElementById('stat-used').innerText = used;
        }

        function renderCoupons(data) {
            let list = document.getElementById('coupons-list');
            list.innerHTML = "";
            if(Object.keys(data).length === 0) { list.innerHTML = "<p class='text-zinc-500 text-center'>No hay cupones.</p>"; return; }
            let now = new Date().getTime();
            for(let code in data) {
                let item = data[code];
                let expired = item.expiresAt && now > item.expiresAt;
                let st = item.used ? `<span class="text-red-400">USADO</span>` : (expired ? `<span class="text-amber-400">VENCIDO</span>` : `<span class="text-emerald-400">ACTIVO</span>`);
                list.innerHTML += `
                    <div class="bg-black/60 p-2.5 rounded-xl border border-zinc-800 flex justify-between items-center">
                        <div><strong class="text-amber-400">${code}</strong>: ${item.customPrize}</div>
                        <div class="flex items-center gap-2">${st} <button onclick="navigator.clipboard.writeText('${code}'); alert('Copiado')" class="bg-zinc-800 text-amber-300 px-2 py-0.5 rounded text-[10px]">📋</button></div>
                    </div>`;
            }
        }

        function filterCoupons() {
            let term = document.getElementById('search-code').value.toUpperCase();
            let filtered = {};
            for(let c in allCouponsData) {
                if(c.includes(term) || allCouponsData[c].customPrize.toUpperCase().includes(term)) filtered[c] = allCouponsData[c];
            }
            renderCoupons(filtered);
        }

        function logout() { localStorage.clear(); window.location.href = "login.html"; }
    </script>
</body>
</html>
