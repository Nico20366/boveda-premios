<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel - Bóveda</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Plus+Jakarta+Sans:wght@500;700;800&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #07070a; color: #f4f4f5; }
        .cinzel { font-family: 'Cinzel', serif; }
        :root { --neon-main: #f59e0b; }
        .casino-bg { background-color: #050508; background-image: radial-gradient(circle at 50% 10%, rgba(245, 158, 11, 0.15) 0%, transparent 50%), radial-gradient(circle at 50% 90%, rgba(0,0,0,0.95) 0%, transparent 60%); }
        .slot-marquee { border: 1px solid rgba(245, 158, 11, 0.3); box-shadow: 0 10px 40px -10px rgba(0, 0, 0, 0.9), 0 0 20px rgba(245, 158, 11, 0.08); background: linear-gradient(145deg, #0d0d12 0%, #060609 100%); }
        .dynamic-text { color: var(--neon-main) !important; }
        .dynamic-btn { background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%); color: #000; font-weight: 800; box-shadow: 0 4px 20px rgba(245, 158, 11, 0.3); transition: all 0.2s ease; }
        .dynamic-btn:hover { filter: brightness(1.1); }
    </style>
</head>
<body class="min-h-screen casino-bg p-3 sm:p-6">
    <div class="max-w-xl mx-auto space-y-4">
        
        <!-- Header -->
        <header class="slot-marquee rounded-2xl p-4 flex justify-between items-center">
            <div>
                <h1 id="panel-title" class="cinzel text-sm sm:text-base font-black dynamic-text">PANEL</h1>
                <p id="welcome-msg" class="text-[11px] text-zinc-400 font-bold mt-0.5"></p>
            </div>
            <button onclick="logout()" class="bg-red-950/80 hover:bg-red-900 text-red-300 border border-red-700/50 px-3 py-1.5 rounded-xl text-xs font-bold">Salir ✖</button>
        </header>

        <!-- Estadísticas -->
        <div class="grid grid-cols-3 gap-2">
            <div class="slot-marquee rounded-xl p-3 text-center">
                <p id="stat-total-label" class="text-[9px] text-zinc-400 font-bold uppercase">Total</p>
                <p id="stat-total" class="text-base font-black dynamic-text">0</p>
            </div>
            <div class="slot-marquee rounded-xl p-3 text-center">
                <p class="text-[9px] text-emerald-400 font-bold uppercase">Disponibles</p>
                <p id="stat-available" class="text-base font-black text-emerald-400">0</p>
            </div>
            <div class="slot-marquee rounded-xl p-3 text-center">
                <p class="text-[9px] text-red-400 font-bold uppercase">Usados</p>
                <p id="stat-used" class="text-base font-black text-red-400">0</p>
            </div>
        </div>

        <!-- Pestañas -->
        <div id="admin-tabs" class="grid grid-cols-3 gap-1 bg-black/60 p-1 rounded-xl border border-zinc-800">
            <button onclick="switchTab('coupons')" id="tab-btn-coupons" class="py-2 rounded-lg text-[11px] font-black cinzel transition-all bg-zinc-800 text-amber-400">📋 Cupones</button>
            <button onclick="switchTab('admins')" id="tab-btn-admins" class="py-2 rounded-lg text-[11px] font-black cinzel transition-all text-zinc-400 hover:text-white">👥 Admins</button>
            <button onclick="switchTab('config')" id="tab-btn-config" class="py-2 rounded-lg text-[11px] font-black cinzel transition-all text-zinc-400 hover:text-white">⚙️ Ajustes</button>
        </div>

        <!-- PESTAÑA 1: CUPONES -->
        <div id="tab-content-coupons" class="space-y-4">
            <div class="slot-marquee rounded-2xl p-4 space-y-3">
                <h3 class="cinzel text-xs font-black dynamic-text">🎁 NUEVO CUPÓN</h3>
                <div class="space-y-2">
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-2">
                        <input type="text" id="new-code" placeholder="Código (Ej: VIP1)" class="bg-black/80 border border-zinc-700 rounded-xl px-3 py-2 text-xs text-white font-bold uppercase focus:outline-none focus:border-amber-500">
                        <input type="text" id="new-prize" placeholder="Premio (Ej: 20% OFF)" class="bg-black/80 border border-zinc-700 rounded-xl px-3 py-2 text-xs text-white font-bold focus:outline-none focus:border-amber-500">
                    </div>
                    
                    <div class="grid grid-cols-1 sm:grid-cols-3 gap-2">
                        <div>
                            <label class="text-[10px] text-zinc-400 font-bold uppercase tracking-wider block mb-1">Tipo de Juego:</label>
                            <select id="new-game-type" class="w-full bg-black/80 border border-zinc-700 rounded-xl px-3 py-2 text-xs text-white font-bold focus:outline-none focus:border-amber-500">
                                <option value="chests">📦 Cofres</option>
                                <option value="roulette">🎡 Ruleta</option>
                            </select>
                        </div>
                        <div>
                            <label class="text-[10px] text-zinc-400 font-bold uppercase tracking-wider block mb-1">Probabilidad (%):</label>
                            <select id="new-probability" class="w-full bg-black/80 border border-zinc-700 rounded-xl px-3 py-2 text-xs text-white font-bold focus:outline-none focus:border-amber-500">
                                <option value="100">100% (Gana Seguro)</option>
                                <option value="75">75% (Alta)</option>
                                <option value="50">50% (50 / 50)</option>
                                <option value="25">25% (Difícil)</option>
                                <option value="10">10% (Jackpot)</option>
                            </select>
                        </div>
                        <div>
                            <label class="text-[10px] text-zinc-400 font-bold uppercase tracking-wider block mb-1">Vencimiento:</label>
                            <input type="datetime-local" id="new-expires-exact" class="w-full bg-black/80 border border-zinc-700 rounded-xl px-3 py-2 text-xs text-white font-bold focus:outline-none focus:border-amber-500">
                        </div>
                    </div>
                </div>
                <button onclick="createCoupon()" class="w-full dynamic-btn py-2.5 rounded-xl text-xs uppercase tracking-wider">Crear Cupón 💾</button>
            </div>

            <div class="slot-marquee rounded-2xl p-4 space-y-3">
                <div class="flex flex-col sm:flex-row justify-between items-center gap-2">
                    <h3 id="list-title" class="cinzel text-xs font-black dynamic-text">📋 CUPONES</h3>
                    <div class="flex items-center gap-1.5 w-full sm:w-auto justify-end">
                        <input type="text" id="search-code" placeholder="🔍 Buscar..." oninput="filterCoupons()" class="bg-black/80 border border-zinc-700 rounded-xl px-2.5 py-1 text-xs text-white font-bold focus:outline-none w-28">
                        <button onclick="clearUsedCoupons()" title="Borrar usados o vencidos" class="bg-amber-950/80 hover:bg-amber-900 text-amber-300 border border-amber-600/50 px-2 py-1 rounded-xl text-[10px] font-bold">🗑️ Limpiar</button>
                        <button onclick="clearAllCoupons()" title="Borrar todos los cupones" class="bg-red-950/80 hover:bg-red-900 text-red-300 border border-red-600/50 px-2 py-1 rounded-xl text-[10px] font-bold">💥 Todo</button>
                    </div>
                </div>
                <div id="coupons-list" class="space-y-1.5 text-xs font-bold max-h-60 overflow-y-auto">
                    <p class="text-zinc-500 text-center py-2">Conectando a Firebase...</p>
                </div>
            </div>
        </div>

        <!-- PESTAÑA 2: ADMINISTRADORES -->
        <div id="tab-content-admins" class="space-y-4 hidden">
            <div class="slot-marquee rounded-2xl p-4 space-y-3">
                <div class="flex justify-between items-center border-b border-zinc-800 pb-2">
                    <h3 class="cinzel text-xs font-black dynamic-text">👥 ADMINISTRADORES</h3>
                    <span id="admins-count-badge" class="text-[10px] bg-amber-500/20 text-amber-300 px-2 py-0.5 rounded-full font-bold">0</span>
                </div>
                <div id="admins-management-list" class="space-y-2 text-xs font-bold max-h-64 overflow-y-auto pt-1">
                    <p class="text-zinc-500 text-center py-2">Conectando a Firebase...</p>
                </div>
            </div>
        </div>

        <!-- PESTAÑA 3: AJUSTES -->
        <div id="tab-content-config" class="space-y-4 hidden">
            <div class="slot-marquee rounded-2xl p-4 space-y-3">
                <h3 class="cinzel text-xs font-black text-amber-400">🔑 CAMBIAR MI CONTRASEÑA</h3>
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-2">
                    <input type="password" id="current-pass" placeholder="Actual" class="bg-black/80 border border-zinc-700 rounded-xl px-3 py-2 text-xs text-white font-bold focus:outline-none">
                    <input type="password" id="new-pass" placeholder="Nueva" class="bg-black/80 border border-zinc-700 rounded-xl px-3 py-2 text-xs text-white font-bold focus:outline-none">
                </div>
                <button onclick="changeMyPassword()" class="w-full bg-zinc-800 hover:bg-zinc-700 text-amber-400 border border-amber-500/30 py-2 rounded-xl text-xs font-bold uppercase">Actualizar Clave</button>
            </div>

            <div id="super-text-section" class="slot-marquee rounded-2xl p-4 space-y-3">
                <h3 class="cinzel text-xs font-black dynamic-text">✏️ TÍTULOS DE LA WEB</h3>
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-2">
                    <input type="text" id="edit-title" placeholder="Título Principal" class="bg-black/80 border border-zinc-700 rounded-xl px-3 py-2 text-xs text-white font-bold uppercase focus:outline-none">
                    <input type="text" id="edit-subtitle" placeholder="Subtítulo" class="bg-black/80 border border-zinc-700 rounded-xl px-3 py-2 text-xs text-white font-bold uppercase focus:outline-none">
                </div>
                <button onclick="saveSiteTexts()" class="w-full dynamic-btn py-2 rounded-xl text-xs uppercase">Guardar Títulos</button>
            </div>
        </div>

    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBqLgy8LhtKaOZgf1tLH5tG6Pm8qYj3ouQ",
            authDomain: "boveda-premios-1ebe0.firebaseapp.com",
            databaseURL: "https://boveda-premios-1ebe0-default-rtdb.firebaseio.com",
            projectId: "boveda-premios-1ebe0",
            storageBucket: "boveda-premios-1ebe0.firebasestorage.app",
            messagingSenderId: "362480473345",
            appId: "1:362480473345:web:5cc957ea431f0c713c3700",
            measurementId: "G-DTRB9M5KJ4"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let currentUser = localStorage.getItem("current_admin");
        let currentRole = localStorage.getItem("admin_role");
        let allCouponsData = {};

        if(!currentUser) { window.location.href = "login.html"; }

        const userStatusRef = db.ref('status/' + currentUser);
        const connectedRef = db.ref('.info/connected');

        connectedRef.on('value', (snap) => {
            if (snap.val() === true) {
                userStatusRef.onDisconnect().set({ state: 'offline', last_changed: firebase.database.ServerValue.TIMESTAMP });
                userStatusRef.set({ state: 'online', last_changed: firebase.database.ServerValue.TIMESTAMP });
            }
        });

        let inactivityTimer;
        function resetInactivityTimer() {
            clearTimeout(inactivityTimer);
            inactivityTimer = setTimeout(() => { logout(); }, 15 * 60 * 1000);
        }
        window.onload = resetInactivityTimer;
        window.onmousemove = resetInactivityTimer;

        function setDefaultExpiration() {
            let now = new Date();
            now.setHours(now.getHours() + 24);
            let isoString = new Date(now.getTime() - (now.getTimezoneOffset() * 60000)).toISOString().slice(0, 16);
            document.getElementById('new-expires-exact').value = isoString;
        }
        setDefaultExpiration();

        if(currentRole === 'super') {
            document.getElementById('welcome-msg').innerText = `${currentUser} (Super Admin)`;
            document.getElementById('panel-title').innerText = "PANEL MAESTRO";
            document.getElementById('stat-total-label').innerText = "Total";
            document.getElementById('list-title').innerText = "📋 TODOS LOS CUPONES";
            loadCurrentTexts();
        } else {
            document.getElementById('welcome-msg').innerText = `${currentUser} (Admin)`;
            document.getElementById('panel-title').innerText = "PANEL";
            document.getElementById('stat-total-label').innerText = "Mis Total";
            document.getElementById('list-title').innerText = "📋 MIS CUPONES";
            document.getElementById('super-text-section').classList.add('hidden');
        }

        loadCoupons();
        loadAdminsManagement();

        function switchTab(tabName) {
            ['coupons', 'admins', 'config'].forEach(t => {
                let content = document.getElementById(`tab-content-${t}`);
                let btn = document.getElementById(`tab-btn-${t}`);
                if (content && btn) {
                    content.classList.add('hidden');
                    btn.className = "py-2 rounded-lg text-[11px] font-black cinzel transition-all text-zinc-400 hover:text-white";
                }
            });
            let targetContent = document.getElementById(`tab-content-${tabName}`);
            let targetBtn = document.getElementById(`tab-btn-${tabName}`);
            if (targetContent && targetBtn) {
                targetContent.classList.remove('hidden');
                targetBtn.className = "py-2 rounded-lg text-[11px] font-black cinzel transition-all bg-zinc-800 text-amber-400 shadow";
            }
        }

        function createCoupon() {
            let code = document.getElementById('new-code').value.trim().toUpperCase();
            let prize = document.getElementById('new-prize').value.trim();
            let gameType = document.getElementById('new-game-type').value;
            let probability = parseInt(document.getElementById('new-probability').value);
            let expireInput = document.getElementById('new-expires-exact').value;

            if(!code || !prize || !expireInput) { alert("Completa todos los campos."); return; }

            let expiresAt = new Date(expireInput).getTime();

            db.ref('cupones/' + code).set({
                used: false, 
                createdBy: currentUser, 
                customPrize: prize, 
                gameType: gameType,
                probability: probability,
                createdAt: new Date().toLocaleDateString(), 
                expiresAt: expiresAt
            }, () => {
                alert(`¡Cupón [${code}] creado con éxito!`);
                document.getElementById('new-code').value = ""; 
                document.getElementById('new-prize').value = "";
                setDefaultExpiration();
            });
        }

        function loadCoupons() {
            db.ref('cupones').on('value', (snap) => {
                let raw = snap.val() || {};
                if (currentRole === 'admin') {
                    allCouponsData = {};
                    for (let c in raw) { if (raw[c].createdBy === currentUser) allCouponsData[c] = raw[c]; }
                } else { allCouponsData = raw; }
                renderCoupons(allCouponsData);
                updateStats(allCouponsData);
            }, (error) => {
                document.getElementById('coupons-list').innerHTML = `<p class='text-red-400 text-center py-2'>Error de conexión con Firebase.</p>`;
            });
        }

        function renderCoupons(data) {
            let list = document.getElementById('coupons-list');
            list.innerHTML = "";
            if(Object.keys(data).length === 0) { 
                list.innerHTML = "<p class='text-zinc-500 text-center py-2'>No hay cupones registrados.</p>"; 
                return; 
            }
            let now = new Date().getTime();
            for(let code in data) {
                let item = data[code];
                let expired = item.expiresAt && now > item.expiresAt;
                let st = item.used ? `<span class="text-red-400">USADO</span>` : (expired ? `<span class="text-amber-400">VENCIDO</span>` : `<span class="text-emerald-400">ACTIVO</span>`);
                
                let gameIcon = item.gameType === 'roulette' ? '🎡 Ruleta' : '📦 Cofres';
                let expireFormatted = item.expiresAt ? new Date(item.expiresAt).toLocaleString([], { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' }) + " hs" : "Sin límite";
                let probText = item.probability !== undefined ? ` | 🎲 ${item.probability}%` : "";

                list.innerHTML += `
                    <div class="bg-black/60 p-2.5 rounded-xl border border-zinc-800 flex justify-between items-center gap-2">
                        <div class="truncate">
                            <strong class="text-amber-400">${code}</strong>: ${item.customPrize} 
                            <div class="text-[9px] text-zinc-400 font-semibold">${gameIcon}${probText}</div>
                            <div class="text-[9px] text-zinc-500">🕒 Vence: ${expireFormatted}</div>
                        </div>
                        <div class="flex items-center gap-1.5 shrink-0">
                            ${st} 
                            <button onclick="navigator.clipboard.writeText('${code}'); alert('Copiado')" class="bg-zinc-800 hover:bg-zinc-700 text-amber-300 px-2 py-1 rounded text-[10px]">📋</button>
                            <button onclick="deleteCoupon('${code}')" class="bg-red-950 hover:bg-red-900 text-red-300 border border-red-600/40 px-2 py-1 rounded text-[10px]">🗑️</button>
                        </div>
                    </div>`;
            }
        }

        function updateStats(data) {
            let total = 0, used = 0, avail = 0, now = new Date().getTime();
            for(let c in data) {
                total++;
                if(data[c].used || (data[c].expiresAt && now > data[c].expiresAt)) used++; else avail++;
            }
            document.getElementById('stat-total').innerText = total;
            document.getElementById('stat-available').innerText = avail;
            document.getElementById('stat-used').innerText = used;
        }

        function deleteCoupon(code) {
            if(!confirm(`¿Eliminar el cupón [${code}]?`)) return;
            db.ref('cupones/' + code).remove();
        }

        function clearUsedCoupons() {
            if(!confirm("¿Eliminar cupones usados o vencidos?")) return;
            let now = new Date().getTime();
            db.ref('cupones').once('value', (snap) => {
                let data = snap.val() || {};
                let updates = {};
                for(let code in data) {
                    let item = data[code];
                    let isExpired = item.expiresAt && now > item.expiresAt;
                    let isCreatorValid = (currentRole === 'super' || item.createdBy === currentUser);
                    if (isCreatorValid && (item.used || isExpired)) {
                        updates[code] = null;
                    }
                }
                db.ref('cupones').update(updates, () => { alert("¡Limpieza completa!"); });
            });
        }

        function clearAllCoupons() {
            if(!confirm("⚠️ ¿Borrar todos los cupones?")) return;
            if (currentRole === 'super') {
                db.ref('cupones').remove();
            } else {
                db.ref('cupones').once('value', (snap) => {
                    let data = snap.val() || {};
                    let updates = {};
                    for(let code in data) {
                        if(data[code].createdBy === currentUser) updates[code] = null;
                    }
                    db.ref('cupones').update(updates);
                });
            }
        }

        function filterCoupons() {
            let term = document.getElementById('search-code').value.toUpperCase();
            let filtered = {};
            for(let c in allCouponsData) {
                if(c.includes(term) || allCouponsData[c].customPrize.toUpperCase().includes(term)) filtered[c] = allCouponsData[c];
            }
            renderCoupons(filtered);
        }

        function loadAdminsManagement() {
            db.ref('admins').on('value', (snap) => {
                let list = document.getElementById('admins-management-list');
                list.innerHTML = "";
                let data = snap.val();
                if(!data) { 
                    list.innerHTML = "<p class='text-zinc-500 text-center py-2'>No hay administradores registrados.</p>";
                    document.getElementById('admins-count-badge').innerText = "0"; 
                    return; 
                }
                let count = 0;
                for(let name in data) {
                    if(name === "superadmin") continue;
                    count++;
                    let info = data[name];
                    let isApproved = info.approved === true;
                    let emailTxt = info.email ? `<div class='text-[10px] text-zinc-400'>${info.email}</div>` : "";
                    let actionBtn = (currentRole === 'super') ? (isApproved ? `<button onclick="toggleAdminApproval('${name}', false)" class="bg-amber-950 text-amber-300 px-2 py-1 rounded">Pausar</button>` : `<button onclick="toggleAdminApproval('${name}', true)" class="bg-emerald-500 text-black px-2 py-1 rounded">Aprobar</button>`) : "";
                    let deleteBtn = (currentRole === 'super') ? `<button onclick="deleteAdmin('${name}')" class="bg-red-950 text-red-300 px-2 py-1 rounded">🗑️</button>` : "";
                    
                    list.innerHTML += `
                        <div class="bg-black/60 p-2.5 rounded-xl border border-zinc-800 flex justify-between items-center">
                            <div><strong>👤 ${name}</strong> ${emailTxt}</div>
                            <div class="flex gap-1">${actionBtn} ${deleteBtn}</div>
                        </div>`;
                }
                document.getElementById('admins-count-badge').innerText = count;
            }, (error) => {
                document.getElementById('admins-management-list').innerHTML = `<p class='text-red-400 text-center py-2'>Error al cargar administradores.</p>`;
            });
        }

        function toggleAdminApproval(name, status) { db.ref('admins/' + name).update({ approved: status }); }
        function deleteAdmin(name) { if(!confirm(`¿Eliminar?`)) return; db.ref('admins/' + name).remove(); db.ref('status/' + name).remove(); }
        
        function changeMyPassword() {
            let currentPassInput = document.getElementById('current-pass').value.trim();
            let newPassInput = document.getElementById('new-pass').value.trim();
            if (!currentPassInput || !newPassInput) { alert("Completa ambos campos."); return; }

            if (currentRole === 'super') {
                db.ref('admins/superadmin/password').once('value', (snap) => {
                    if (currentPassInput !== (snap.val() || "123456")) { alert("Contraseña incorrecta."); return; }
                    db.ref('admins/superadmin').update({ password: newPassInput, approved: true }, () => {
                        alert("¡Contraseña actualizada!");
                        document.getElementById('current-pass').value = ""; document.getElementById('new-pass').value = "";
                    });
                });
            } else {
                db.ref('admins/' + currentUser).once('value', (snap) => {
                    let data = snap.val();
                    if (!data || data.password !== currentPassInput) { alert("Contraseña incorrecta."); return; }
                    db.ref('admins/' + currentUser).update({ password: newPassInput }, () => {
                        alert("¡Contraseña actualizada!");
                        document.getElementById('current-pass').value = ""; document.getElementById('new-pass').value = "";
                    });
                });
            }
        }

        function loadCurrentTexts() {
            db.ref('configuracion').once('value', (snap) => {
                let data = snap.val();
                if(data) {
                    if(data.titulo) document.getElementById('edit-title').value = data.titulo;
                    if(data.subtitulo) document.getElementById('edit-subtitle').value = data.subtitulo;
                }
            });
        }

        function saveSiteTexts() {
            let titulo = document.getElementById('edit-title').value.trim().toUpperCase();
            let subtitulo = document.getElementById('edit-subtitle').value.trim().toUpperCase();
            db.ref('configuracion').set({ titulo: titulo || "BÓVEDA DE LA SUERTE", subtitO: subtitulo || "ZONA DE PREMIOS" }, () => { alert("¡Guardado!"); });
        }

        function logout() { 
            if(currentUser) {
                db.ref('status/' + currentUser).set({ state: 'offline', last_changed: firebase.database.ServerValue.TIMESTAMP });
            }
            localStorage.clear(); 
            window.location.href = "login.html"; 
        }
    </script>
</body>
</html>
