<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Administración - Bóveda</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Plus+Jakarta+Sans:wght@600;800;900&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #020204; color: #ffffff; }
        .cinzel { font-family: 'Cinzel', serif; }
        :root { --neon-main: #eab308; --neon-glow: rgba(234, 179, 8, 0.3); --neon-shadow: rgba(234, 179, 8, 0.7); }
        .casino-bg { background-color: #050508; background-image: radial-gradient(circle at 50% 20%, var(--neon-glow) 0%, transparent 60%), radial-gradient(circle at 50% 90%, rgba(0,0,0,0.95) 0%, transparent 60%); }
        .slot-marquee { border: 4px solid var(--neon-main); box-shadow: 0 0 35px var(--neon-shadow), inset 0 0 20px rgba(0,0,0,0.8); background: linear-gradient(180deg, #141419 0%, #08080b 100%); }
        .dynamic-text { text-shadow: 0 0 15px var(--neon-main); color: var(--neon-main) !important; }
        .dynamic-btn { background: linear-gradient(135deg, var(--neon-main) 0%, #ca8a04 100%); color: #000 !important; font-weight: 900; box-shadow: 0 0 25px var(--neon-shadow); }
    </style>
</head>
<body class="min-h-screen casino-bg p-4 sm:p-8">
    <div class="max-w-3xl mx-auto space-y-6">
        
        <!-- Header & Stats -->
        <header class="slot-marquee rounded-3xl p-6 flex flex-col sm:flex-row justify-between items-center gap-4">
            <div>
                <h1 id="panel-title" class="cinzel text-xl sm:text-2xl font-black dynamic-text">PANEL DE CONTROL</h1>
                <p id="welcome-msg" class="text-xs text-zinc-300 font-bold mt-1"></p>
            </div>
            <button onclick="logout()" class="bg-red-950 hover:bg-red-900 text-red-300 border border-red-600 px-4 py-2 rounded-xl text-xs font-bold transition-all">Cerrar Sesión ✖</button>
        </header>

        <!-- Tarjetas de Estadísticas en Vivo -->
        <div class="grid grid-cols-3 gap-3">
            <div class="slot-marquee rounded-2xl p-4 text-center">
                <p id="stat-total-label" class="text-[10px] text-zinc-400 font-bold uppercase">Mis Cupones</p>
                <p id="stat-total" class="text-xl sm:text-2xl font-black dynamic-text">0</p>
            </div>
            <div class="slot-marquee rounded-2xl p-4 text-center">
                <p class="text-[10px] text-emerald-400 font-bold uppercase">Disponibles</p>
                <p id="stat-available" class="text-xl sm:text-2xl font-black text-emerald-400">0</p>
            </div>
            <div class="slot-marquee rounded-2xl p-4 text-center">
                <p class="text-[10px] text-red-400 font-bold uppercase">Usados</p>
                <p id="stat-used" class="text-xl sm:text-2xl font-black text-red-400">0</p>
            </div>
        </div>

        <!-- 👑 SECCIÓN EXCLUSIVA: EDITAR TEXTOS DE LA PÁGINA (Solo Super Admin) -->
        <div id="super-text-section" class="slot-marquee rounded-3xl p-6 hidden space-y-4">
            <div class="border-b border-zinc-800 pb-3 flex justify-between items-center">
                <h3 class="cinzel text-sm font-black dynamic-text">✏️ EDITAR TEXTOS DE LA PÁGINA PRINCIPAL</h3>
                <span class="text-[10px] bg-amber-500/20 text-amber-300 border border-amber-500/40 px-2.5 py-1 rounded-lg font-bold">Personalización</span>
            </div>
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                <div>
                    <label class="text-xs text-zinc-300 font-bold">Título Principal:</label>
                    <input type="text" id="edit-title" placeholder="EJ: BÓVEDA DE LA SUERTE" class="w-full bg-black border-2 border-zinc-700 rounded-xl px-3 py-2 text-sm text-white font-bold uppercase mt-1 focus:border-amber-500 focus:outline-none">
                </div>
                <div>
                    <label class="text-xs text-zinc-300 font-bold">Subtítulo / Zona:</label>
                    <input type="text" id="edit-subtitle" placeholder="EJ: ZONA DE PREMIOS" class="w-full bg-black border-2 border-zinc-700 rounded-xl px-3 py-2 text-sm text-white font-bold uppercase mt-1 focus:border-amber-500 focus:outline-none">
                </div>
            </div>
            <button onclick="saveSiteTexts()" class="w-full bg-amber-500 hover:bg-amber-400 text-black font-black py-3 rounded-xl text-xs cinzel uppercase tracking-wider shadow">
                Guardar Textos en la Nube 💾
            </button>
        </div>

        <!-- 👑 SECCIÓN EXCLUSIVA DE CONTROL TOTAL DEL SUPER ADMIN -->
        <div id="super-admin-section" class="slot-marquee rounded-3xl p-6 hidden space-y-4">
            <div class="border-b border-zinc-800 pb-3 flex justify-between items-center">
                <h3 class="cinzel text-sm font-black dynamic-text">👑 CONTROL TOTAL DE ADMINISTRADORES</h3>
                <span class="text-[10px] bg-amber-500/20 text-amber-300 border border-amber-500/40 px-2.5 py-1 rounded-lg font-bold">Modo Maestro</span>
            </div>
            <div id="admins-management-list" class="space-y-2 text-xs font-bold"></div>
        </div>

        <!-- Crear Cupón -->
        <div class="slot-marquee rounded-3xl p-6 space-y-4">
            <h3 class="cinzel text-sm font-black dynamic-text">🎁 CREAR NUEVO CUPÓN CON PREMIO</h3>
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                <div>
                    <label class="text-xs text-zinc-300 font-bold">Código:</label>
                    <input type="text" id="new-code" placeholder="Ej: JUAN50" class="w-full bg-black border-2 border-zinc-700 rounded-xl px-3 py-2 text-sm text-white font-bold uppercase mt-1 focus:border-amber-500 focus:outline-none">
                </div>
                <div>
                    <label class="text-xs text-zinc-300 font-bold">Premio Específico:</label>
                    <input type="text" id="new-prize" placeholder="Ej: ¡Ganó 20% extra!" class="w-full bg-black border-2 border-zinc-700 rounded-xl px-3 py-2 text-sm text-white font-bold mt-1 focus:border-amber-500 focus:outline-none">
                </div>
            </div>
            <button onclick="createCoupon()" class="w-full dynamic-btn py-3 rounded-xl text-xs cinzel uppercase tracking-wider">Guardar Cupón en la Nube 💾</button>
        </div>

        <!-- Lista de Cupones con Buscador -->
        <div class="slot-marquee rounded-3xl p-6 space-y-4">
            <div class="flex flex-col sm:flex-row justify-between items-center gap-3">
                <h3 id="list-title" class="cinzel text-sm font-black dynamic-text">📋 MIS CUPONES</h3>
                <input type="text" id="search-code" placeholder="🔍 Buscar código..." oninput="filterCoupons()" class="bg-black border border-zinc-700 rounded-xl px-3 py-1.5 text-xs text-white font-bold focus:outline-none focus:border-amber-500 w-full sm:w-48">
            </div>
            <div id="coupons-list" class="space-y-2 text-xs font-bold max-h-64 overflow-y-auto"></div>
        </div>

    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBqLgy8LhtKaOZgf1tLH5tG6Pm8qYj3ouQ",
            authDomain: "boveda-premios-1ebe0.firebaseapp.com",
            databaseURL: "https://boveda-premios-1ebe0-default-rtdb.firebaseio.com",
            projectId: "boveda-premios-1ebe0",
            storageBucket: "boveda-premios-1ebe0.firebasestorage.app",
            messagingSenderId: "362480473345",
            appId: "1:362480473345:web:5cc957ea431f0c713c3700",
            measurementId: "G-DTRB9M5KJ4"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let currentUser = localStorage.getItem("current_admin");
        let currentRole = localStorage.getItem("admin_role");
        let allCouponsData = {};

        if(!currentUser) { window.location.href = "login.html"; }

        if(currentRole === 'super') {
            document.getElementById('welcome-msg').innerText = `Conectado como: ${currentUser} (Super Admin - Control Total)`;
            document.getElementById('panel-title').innerText = "PANEL MAESTRO";
            document.getElementById('stat-total-label').innerText = "Cupones Totales";
            document.getElementById('list-title').innerText = "📋 TODOS LOS CUPONES DEL SISTEMA";
            document.getElementById('super-admin-section').classList.remove('hidden');
            document.getElementById('super-text-section').classList.remove('hidden');
            loadAdminsManagement();
            loadCurrentTexts();
        } else {
            document.getElementById('welcome-msg').innerText = `Conectado como: ${currentUser} (Administrador)`;
            document.getElementById('panel-title').innerText = "PANEL DE ADMINISTRADOR";
            document.getElementById('stat-total-label').innerText = "Mis Cupones";
            document.getElementById('list-title').innerText = "📋 MIS CUPONES CREADOS";
        }

        loadCoupons();

        function loadCurrentTexts() {
            db.ref('configuracion').once('value', (snap) => {
                let data = snap.val();
                if(data) {
                    if(data.titulo) document.getElementById('edit-title').value = data.titulo;
                    if(data.subtitulo) document.getElementById('edit-subtitle').value = data.subtitulo;
                }
            });
        }

        function saveSiteTexts() {
            let titulo = document.getElementById('edit-title').value.trim().toUpperCase();
            let subtitulo = document.getElementById('edit-subtitle').value.trim().toUpperCase();

            db.ref('configuracion').set({
                titulo: titulo || "BÓVEDA DE LA SUERTE",
                subtitulo: subtitulo || "ZONA DE PREMIOS"
            }, () => {
                alert("¡Textos de la página principal actualizados con éxito en la nube!");
            });
        }

        function loadAdminsManagement() {
            db.ref('admins').on('value', (snap) => {
                let list = document.getElementById('admins-management-list');
                list.innerHTML = "";
                let data = snap.val();
                if(!data) { list.innerHTML = "<p class='text-zinc-500'>No hay administradores registrados.</p>"; return; }

                for(let name in data) {
                    if(name === "superadmin") continue;
                    let isApproved = data[name].approved;
                    let statusBadge = isApproved 
                        ? `<span class="text-emerald-400 bg-emerald-950/60 px-2 py-0.5 rounded border border-emerald-800">ACTIVO</span>` 
                        : `<span class="text-amber-400 bg-amber-950/60 px-2 py-0.5 rounded border border-amber-800">PENDIENTE</span>`;
                    
                    let actionButtons = isApproved
                        ? `<button onclick="toggleAdminApproval('${name}', false)" class="bg-amber-950 hover:bg-amber-900 text-amber-300 border border-amber-600 px-3 py-1.5 rounded-lg font-bold">Suspender</button>`
                        : `<button onclick="toggleAdminApproval('${name}', true)" class="bg-emerald-500 hover:bg-emerald-400 text-black px-3 py-1.5 rounded-lg font-black">Aprobar ✓</button>`;
                    
                    actionButtons += `<button onclick="deleteAdmin('${name}')" class="bg-red-950 hover:bg-red-900 text-red-300 border border-red-600 px-3 py-1.5 rounded-lg font-bold">Eliminar 🗑️</button>`;

                    list.innerHTML += `
                        <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center bg-zinc-900 p-3.5 rounded-xl border border-zinc-800 gap-2">
                            <div>
                                <span class="text-white font-black text-sm">👤 ${name}</span>
                                <div class="mt-1">${statusBadge}</div>
                            </div>
                            <div class="flex items-center gap-2 w-full sm:w-auto justify-end">
                                ${actionButtons}
                            </div>
                        </div>
                    `;
                }
            });
        }

        function toggleAdminApproval(name, status) {
            db.ref('admins/' + name).update({ approved: status });
            alert(status ? `¡Acceso aprobado para ${name}!` : `Acceso suspendido para ${name}.`);
        }

        function deleteAdmin(name) {
            if(!confirm(`⚠️ ¿Estás totalmente seguro de eliminar la cuenta [${name}]?`)) return;
            db.ref('admins/' + name).remove();
            alert(`Cuenta de ${name} eliminada.`);
        }

        function createCoupon() {
            let code = document.getElementById('new-code').value.trim().toUpperCase();
            let prize = document.getElementById('new-prize').value.trim();
            if(!code || !prize) { alert("Complete todos los campos."); return; }

            db.ref('cupones/' + code).set({
                used: false,
                createdBy: currentUser,
                customPrize: prize,
                createdAt: new Date().toLocaleString()
            }, () => {
                alert(`¡Cupón [${code}] creado con éxito!`);
                document.getElementById('new-code').value = "";
                document.getElementById('new-prize').value = "";
            });
        }

        function loadCoupons() {
            db.ref('cupones').on('value', (snap) => {
                let rawData = snap.val() || {};
                if (currentRole === 'admin') {
                    allCouponsData = {};
                    for (let c in rawData) {
                        if (rawData[c].createdBy === currentUser) {
                            allCouponsData[c] = rawData[c];
                        }
                    }
                } else {
                    allCouponsData = rawData;
                }
                renderCouponsList(allCouponsData);
                updateStats(allCouponsData);
            });
        }

        function updateStats(data) {
            let total = 0, used = 0, available = 0;
            for(let c in data) {
                total++;
                if(data[c].used) used++; else available++;
            }
            document.getElementById('stat-total').innerText = total;
            document.getElementById('stat-available').innerText = available;
            document.getElementById('stat-used').innerText = used;
        }

        function renderCouponsList(data) {
            let list = document.getElementById('coupons-list');
            list.innerHTML = "";
            if(Object.keys(data).length === 0) { 
                list.innerHTML = "<p class='text-zinc-500 text-center py-2'>No hay cupones registrados.</p>"; 
                return; 
            }

            for(let code in data) {
                let item = data[code];
                let status = item.used ? `<span class="text-red-400">[USADO]</span>` : `<span class="text-emerald-400">[DISPONIBLE]</span>`;
                let copyBtn = `<button onclick="navigator.clipboard.writeText('${code}'); alert('Copiado: ${code}')" class="bg-zinc-800 text-amber-300 px-2.5 py-1 rounded text-[10px] border border-amber-500/30 font-bold">📋 Copiar</button>`;
                let creatorInfo = currentRole === 'super' ? `<div class="text-[10px] text-zinc-500">Creado por: ${item.createdBy || 'Sistema'}</div>` : "";

                list.innerHTML += `
                    <div class="coupon-row bg-zinc-900 p-3 rounded-xl border border-zinc-800 flex justify-between items-center" data-code="${code}">
                        <div>
                            <span class="text-amber-400 font-black text-sm">${code}</span> -> ${item.customPrize}
                            ${creatorInfo}
                        </div>
                        <div class="flex items-center gap-2 text-right text-xs">
                            ${status} ${copyBtn}
                        </div>
                    </div>
                `;
            }
        }

        function filterCoupons() {
            let term = document.getElementById('search-code').value.toUpperCase();
            let filtered = {};
            for(let c in allCouponsData) {
                if(c.includes(term) || allCouponsData[c].customPrize.toUpperCase().includes(term)) {
                    filtered[c] = allCouponsData[c];
                }
            }
            renderCouponsList(filtered);
        }

        function logout() {
            localStorage.clear();
            window.location.href = "login.html";
        }
    </script>
</body>
</html>
